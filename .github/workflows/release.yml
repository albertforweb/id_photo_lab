name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate or validate app icons
        run: npm run icons:build

      - name: Run unit and catalog checks
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Verify production build and packaged assets
        run: npm run package:preflight

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_script: package:mac
          - name: Windows
            os: windows-latest
            package_script: package:win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate or validate app icons
        run: npm run icons:build

      - name: Package desktop app
        run: npm run ${{ matrix.package_script }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: id-photo-lab-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="$PUSH_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          fi

          release_notes="$(mktemp)"
          {
            echo "ID Photo Lab $tag"
            echo
            echo "- Commit: $TARGET_SHA"
            echo "- Includes macOS DMG/ZIP and Windows NSIS/ZIP assets built by GitHub Actions."
            echo "- Quality gate: unit tests, catalog validation, browser smoke tests, production build, and packaged asset verification."
          } > "$release_notes"

          release_args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Using existing release $tag"
          else
            gh release create "$tag" \
              --target "$TARGET_SHA" \
              --title "ID Photo Lab $tag" \
              --notes-file "$release_notes" \
              "${release_args[@]}"
          fi

          mapfile -d '' files < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          gh release upload "$tag" "${files[@]}" --clobber
